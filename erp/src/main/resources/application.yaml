logging:
  file:
    name: /tmp/erp.log
  level:
    com.fritomix: INFO

spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/fritomix_erp
    username: postgres
    password: ${DB_PASSWORD:123456}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    jwt:
      secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LW5vdC12YWxpZC1mb3ItcHJvZA==}
      access-token-expiration: 28800000
      refresh-token-expiration: 604800000

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  cookie:
    secure: ${APP_COOKIE_SECURE:false}
    same-site: ${APP_COOKIE_SAME_SITE:lax}
  security:
    login-rate-limit:
      max-attempts: 5
      window-seconds: 60
  notifications:
    email-enabled: ${NOTIFICATIONS_EMAIL_ENABLED:true}
