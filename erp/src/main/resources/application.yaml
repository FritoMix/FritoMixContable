logging:
  file:
    name: /tmp/erp.log
  level:
    com.fritomix: DEBUG

spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/fritomix_erp
    username: postgres
    password: ${DB_PASSWORD:123456}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    jwt:
      secret: ${JWT_SECRET:uiitDhPY8NyEuQl8Ak7yw5SuascSN+vAnQZy83C2GHev9uTjVgsjUFaNYzzbAe5/x5xnZkV70VHFkSh8rg6/Ug==}
      access-token-expiration: 28800000
      refresh-token-expiration: 604800000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  cookie:
    secure: ${APP_COOKIE_SECURE:false}
    same-site: ${APP_COOKIE_SAME_SITE:lax}
