logging:
  file:
    name: /tmp/erp.log
  level:
    com.fritomix: INFO
    org.springframework: WARN

management:
  health:
    mail:
      enabled: false

spring:

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      data-source-properties:
        sslmode: require

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    connect-retries: 6
    connect-retries-interval: 5

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    api-key: ${MAIL_API_KEY:}
    from: ${MAIL_FROM:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: 28800000
      refresh-token-expiration: 604800000

app:
  frontend-url: ${APP_FRONTEND_URL:https://fritomix.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  cookie:
    secure: ${APP_COOKIE_SECURE:true}
    same-site: ${APP_COOKIE_SAME_SITE:none}
  security:
    expose-api-docs: ${EXPOSE_API_DOCS:false}
    login-rate-limit:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      window-seconds: ${LOGIN_WINDOW_SECONDS:60}
  push:
    enabled: ${PUSH_ENABLED:true}
    vapid:
      public-key: ${VAPID_PUBLIC_KEY:}
      private-key: ${VAPID_PRIVATE_KEY:}
      subject: ${VAPID_SUBJECT:mailto:soporte@fritomix.com}
