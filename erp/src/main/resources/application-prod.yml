logging:
  file:
    name: /tmp/erp.log
  level:
    com.fritomix: INFO
    org.springframework: WARN

management:
  health:
    mail:
      enabled: false

spring:

  datasource:
    url: ${DB_URL:jdbc:postgresql://aws-0-ca-central-1.pooler.supabase.com:5432/postgres?user=postgres.nphasytrfbszgxyyfjzc&ssl=true&sslmode=require}
    username: ${DB_USERNAME:postgres.nphasytrfbszgxyyfjzc}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: 28800000
      refresh-token-expiration: 604800000

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  cookie:
    secure: ${APP_COOKIE_SECURE:true}
